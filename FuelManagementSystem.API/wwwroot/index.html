<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система заправки - Панель управления</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Шапка -->
        <header class="dashboard-header">
            <div class="header-left">
                <h1 class="system-title">Система заправки</h1>
                <div class="user-info">
                    <span class="user-name" id="userName">[Имя пользователя]</span>
                    <span class="user-role" id="userRole">[Роль]</span>
                </div>
            </div>

            <div class="header-right">
                <nav class="main-nav">
                    <button id="statisticsBtn" class="nav-btn">
                        Статистика
                    </button>
                    <button class="nav-btn logout-btn">
                        Выйти
                    </button>
                </nav>
            </div>
        </header>

        <!-- Основное содержание -->
        <main class="dashboard-main">
            <div class="content-header">
                <div class="header-top-section">
                    <h2 class="section-title">Таблицы</h2>
                    <div class="header-actions">
                        <button id="generateBtn" class="generate-btn" disabled>
                            Обновить данные
                        </button>
                    </div>
                </div>

                <div class="controls-row">
                    <div class="table-selection">
                        <label for="tableSelect" class="select-label">Название таблицы</label>
                        <select id="tableSelect" class="table-select">
                            <option value="">-- Выберите таблицу --</option>
                            <option value="equipment">Оборудование</option>
                            <option value="fuel">Топливо</option>
                            <option value="geyser">Колонки</option>
                            <option value="users">Пользователи</option>
                            <option value="repair">Ремонты</option>
                            <option value="roles">Роли</option>
                        </select>
                    </div>

                    <div class="action-buttons">
                        <button id="createDataBtn" class="create-data-btn" disabled>
                            Создать данные
                        </button>
                    </div>
                </div>
            </div>

            <!-- Область для данных таблицы -->
            <div class="data-container">
                <div id="loading" class="loading">
                    <div class="loading-spinner"></div>
                    <p>Загрузка данных...</p>
                </div>

                <div id="noData" class="no-data">
                    <p>Выберите таблицу</p>
                </div>

                <div id="dataTableContainer" class="table-container" style="display: none;">
                    <table class="data-table">
                        <thead id="tableHeader">
                            <!-- Заголовки будут заполнены динамически -->
                        </thead>
                        <tbody id="tableBody">
                            <!-- Данные будут заполнены динамически -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Модальное окно для подробного просмотра -->
    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- Модальное окно для редактирования/создания -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div id="editModalContent"></div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
