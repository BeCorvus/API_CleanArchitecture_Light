<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система заправки - Авторизация</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/loginStyle.css">
</head>
<body>
    <div class="login-container">
        <h1 class="system-title">Система доступа</h1>

        <div class="form-tabs">
            <button class="tab-btn active" onclick="showTab('login')">Вход</button>
            <button class="tab-btn" onclick="showTab('register')">Регистрация</button>
        </div>

        <!-- Сообщения -->
        <div id="message" class="message"></div>

        <!-- Форма входа -->
        <form id="loginForm" class="auth-form active">
            <div class="form-group">
                <label for="loginInput">Логин или Email</label>
                <input type="text" id="loginInput" class="form-control" placeholder="Введите логин или email" required>
            </div>

            <div class="form-group">
                <label for="loginPassword">Пароль</label>
                <div class="password-container">
                    <input type="password" id="loginPassword" class="form-control" placeholder="Введите пароль" required>
                    <span class="toggle-password" onclick="togglePassword('loginPassword')">👁️</span>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Войти</button>

            <div class="form-footer">
                <a href="#" onclick="showTab('register')">Создать аккаунт</a>
            </div>
        </form>

        <!-- Форма регистрации -->
        <form id="registerForm" class="auth-form">
            <div class="form-group">
                <label for="regUsername">Логин *</label>
                <input type="text" id="regUsername" class="form-control" placeholder="Придумайте логин" required>
                <small class="form-text">Будет использоваться для входа в систему</small>
            </div>

            <div class="form-group">
                <label for="regEmail">Email *</label>
                <input type="email" id="regEmail" class="form-control" placeholder="Введите ваш email" required>
            </div>

            <div class="form-group">
                <label for="regPassword">Пароль *</label>
                <div class="password-container">
                    <input type="password" id="regPassword" class="form-control" placeholder="Придумайте пароль" required oninput="checkPasswordStrength()">
                    <span class="toggle-password" onclick="togglePassword('regPassword')">👁️</span>
                </div>
                <div class="password-strength">
                    <div id="strengthBar" class="strength-bar"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="regConfirmPassword">Подтверждение пароля *</label>
                <div class="password-container">
                    <input type="password" id="regConfirmPassword" class="form-control" placeholder="Повторите пароль" required>
                    <span class="toggle-password" onclick="togglePassword('regConfirmPassword')">👁️</span>
                </div>
            </div>

            <div class="form-group">
                <label for="regNote">Примечание (необязательно)</label>
                <textarea id="regNote" class="form-control" rows="3" placeholder="Дополнительная информация"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Зарегистрироваться</button>

            <div class="form-footer">
                Уже есть аккаунт? <a href="#" onclick="showTab('login')">Войти</a>
            </div>
        </form>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
